<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="bar-grad-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="bar-grad-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="bar-grad-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    /* Ambient pulse & dynamic flows */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes lineDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveMove {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .ambient-orb {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .chart-wave {
      animation: waveMove 6s ease-in-out infinite;
    }
    .animated-line {
      stroke-dasharray: 8, 6;
      animation: lineDash 20s linear infinite;
    }
    .float-card-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .float-card-2 {
      animation: floatPill 6s ease-in-out infinite 1s;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Background Ambient Glows -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="ambient-orb" />
  <circle cx="1050" cy="180" r="180" fill="#818cf8" opacity="0.14" filter="url(#glow)" class="ambient-orb" />
  <circle cx="650" cy="300" r="160" fill="#c084fc" opacity="0.1" filter="url(#glow)" class="ambient-orb" />

  <!-- DYNAMIC BACKGROUND VISUALIZATIONS (Right Side & Lower Third) -->
  <g opacity="0.85" class="chart-wave">
    <!-- Area Chart Background -->
    <path d="M 680 270 Q 750 200, 830 220 T 980 160 T 1140 180 L 1140 280 L 680 280 Z" fill="url(#area-grad)" />
    <!-- Line on Chart -->
    <path d="M 680 270 Q 750 200, 830 220 T 980 160 T 1140 180" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow-soft)" />
    
    <!-- Secondary Trend Line (Animated Dash) -->
    <path class="animated-line" d="M 680 250 Q 780 260, 860 190 T 1020 170 T 1140 120" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.75" />
  </g>

  <!-- Metric Bar Visuals (Right Background) -->
  <g opacity="0.55" transform="translate(730, 160)">
    <rect x="0" y="40" width="16" height="80" rx="4" fill="url(#bar-grad-1)" />
    <rect x="28" y="15" width="16" height="105" rx="4" fill="url(#bar-grad-2)" />
    <rect x="56" y="55" width="16" height="65" rx="4" fill="url(#bar-grad-1)" />
    <rect x="84" y="25" width="16" height="95" rx="4" fill="url(#bar-grad-3)" />
    <rect x="112" y="5" width="16" height="115" rx="4" fill="url(#bar-grad-2)" />
  </g>

  <!-- Floating Analytics Data Widget (Top Right Background - Kept away from text) -->
  <g class="float-card-1" transform="translate(940, 42)">
    <rect width="190" height="64" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#glow-soft)" />
    <circle cx="24" cy="32" r="10" fill="#10b981" fill-opacity="0.2" />
    <circle cx="24" cy="32" r="5" fill="#10b981" />
    <text x="44" y="27" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">LIVE METRICS</text>
    <text x="44" y="46" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">99.98% Uptime</text>
  </g>

  <g class="float-card-2" transform="translate(780, 78)">
    <rect width="150" height="52" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#glow-soft)" />
    <path d="M 16 34 L 28 20 L 40 26 L 54 14" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">INSIGHTS</text>
    <text x="64" y="40" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">+42.8% MoM</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Subtitle & Badges (Clean, Crisp, High Contrast) -->
  <g transform="translate(70, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="19" fill="#38bdf8" class="badge-pill-text">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text">
      Awesome <tspan fill="url(#primary-grad)">Data Visualization</tspan>
    </text>
    <text x="0" y="184" class="title-text">
      &amp; Dashboards 📊
    </text>

    <!-- Subtitle -->
    <text x="0" y="228" class="subtitle-text">
      The definitive directory of Business Intelligence platforms, observability suites &amp; charting libraries.
    </text>

    <!-- Pills / Category Chips -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" />
      <text x="16" y="21" fill="#cbd5e1" class="badge-pill-text">🚀 Enterprise BI</text>

      <!-- Pill 2 -->
      <rect x="177" y="0" width="185" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" />
      <text x="193" y="21" fill="#cbd5e1" class="badge-pill-text">📈 Observability &amp; APM</text>

      <!-- Pill 3 -->
      <rect x="374" y="0" width="165" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" />
      <text x="390" y="21" fill="#cbd5e1" class="badge-pill-text">⚡ Open Source</text>

      <!-- Pill 4 -->
      <rect x="551" y="0" width="165" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" />
      <text x="567" y="21" fill="#cbd5e1" class="badge-pill-text">🧩 Embedded Viz</text>
    </g>
  </g>
</svg>
